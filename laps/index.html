<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LAPS指数</title>
<meta name="description" content="LAPS指数（JRA 1〜12R）。3着以内に入る確率の形の指数を、ペース（標準・スロー・ハイ）ごとに。毎週更新。">
<style>
:root{color-scheme:light;--s1:#fcfcfb;--s2:#f2f2ef;--plane:#f9f9f7;--ink1:#0b0b0b;--ink2:#52514e;--muted:#898781;
--axis:#c3c2b7;--border:rgba(11,11,11,.10);--shade:rgba(11,11,11,.04);--acc:#2a78d6;--good:#006300;--crit:#d03b3b;--big:rgba(120,100,220,.22)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--s1:#1a1a19;--s2:#232322;--plane:#0d0d0d;
--ink1:#fff;--ink2:#c3c2b7;--axis:#383835;--border:rgba(255,255,255,.10);--shade:rgba(255,255,255,.05);--acc:#3987e5;--good:#0ca30c;--crit:#e05a5a}}
:root[data-theme="dark"]{color-scheme:dark;--s1:#1a1a19;--s2:#232322;--plane:#0d0d0d;--ink1:#fff;--ink2:#c3c2b7;--axis:#383835;
--border:rgba(255,255,255,.10);--shade:rgba(255,255,255,.05);--acc:#3987e5;--good:#0ca30c;--crit:#e05a5a}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink1);font:14px/1.6 system-ui,-apple-system,"Segoe UI","Yu Gothic UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
.logo{display:block;width:320px;max-width:80%;height:auto;border-radius:8px;margin:0 0 12px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 14px}
.bar{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:8px 0}
.lab{font-size:12px;color:var(--muted);margin-right:2px}
.pill{font:inherit;font-size:13px;padding:3px 12px;border-radius:999px;border:1px solid var(--axis);background:var(--s1);color:var(--ink1);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink1);color:var(--plane);border-color:var(--ink1)}
.rno{min-width:40px}
.card{background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:14px 14px 10px;margin-top:10px}
.rh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:8px}
.rh b{font-size:16px}
.rh span{color:var(--ink2);font-size:13px}
.tw{overflow-x:auto}
table{border-collapse:collapse;min-width:100%;font-size:13px}
th,td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
th{font-size:12px;color:var(--ink1);font-weight:650;background:var(--s2);line-height:1.25}
th.big{background:var(--big);font-weight:700;border-bottom:1px solid var(--muted)}
td.name{text-align:left;font-weight:650;font-size:13.5px;position:sticky;left:0;background:var(--s1)}
th.name{position:sticky;left:0;z-index:2}
.waku{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:3px;font-size:12px;font-weight:700;border:1px solid var(--axis)}
td.ais{font-size:12px;font-weight:650}
td.sc{font-variant-numeric:tabular-nums;min-width:44px}
td.up{color:var(--good)} td.dn{color:var(--crit)}
td.tot{font-weight:800;font-size:14px}
td.fin,th.fin{border-left:3px solid var(--ink2)}
td.fin{font-weight:800;font-size:14px}
.mv{font-size:12px;font-weight:700;margin-left:2px}
.mv.up{color:var(--good)} .mv.dn{color:var(--crit)}
td.base,th.base{border-left:1px solid var(--axis)}
td.bl{color:var(--ink2);font-size:12px;max-width:72px;overflow:hidden}
td.bl span{display:inline-block;filter:blur(4px);user-select:none;pointer-events:none}
.chip{display:inline-block;padding:0 4px;border-radius:4px;border:1px solid var(--axis);background:var(--shade)}
.chip.u{border-color:var(--good)} .chip.d{border-color:var(--crit)}
th.lockh{background:rgba(42,120,214,.12);padding:3px 6px}
th.lockh a{color:var(--acc);font-size:11.5px;font-weight:700;text-decoration:none;border:1px solid var(--acc);border-radius:999px;padding:0 10px;background:var(--s1)}
th.lockh a:hover{background:var(--acc);color:#fff}
th.bl{font-size:11px;color:var(--ink2);font-weight:600}
.none{color:var(--muted)}
.cta{margin:16px 0 0;padding:14px 16px;border:1.5px solid var(--acc);border-radius:10px;background:var(--s1)}
.cta b{color:var(--acc)}
.cta a{display:inline-block;margin-top:8px;padding:5px 16px;border-radius:999px;background:var(--acc);color:#fff;text-decoration:none;font-weight:700}
.note{color:var(--ink2);font-size:12.5px;margin:12px 0 0}
.about{font-size:13px;color:var(--ink2);margin:0 0 6px}
.about b{color:var(--ink1)}
footer{margin-top:28px;padding-top:10px;border-top:1px solid var(--border);color:var(--muted);font-size:12px}
footer a{color:var(--muted)}
</style></head><body><div class="wrap">

<script>
var D = JSON.parse(document.getElementById('data').textContent);
var st = {d: D.days.length - 1, v: 0, r: 0, s: 0, sort: 'num'};
function el(t, a, x){var e=document.createElement(t); if(a) for(var k in a) e.setAttribute(k,a[k]); if(x!=null) e.textContent=x; return e;}
function pct(p){return (p>0?'+':(p<0?'−':'±'))+Math.abs(p)+'%';}
function rate(p){return p==null?'−':(p*100).toFixed(1)+'%';}
function pills(box, lab, items, cur, on){box.appendChild(el('span',{class:'lab'},lab));
  items.forEach(function(t,i){var b=el('button',{type:'button',class:'pill'+(lab==='R'?' rno':''),'aria-pressed':i===cur?'true':'false'},t);
  b.addEventListener('click',function(){on(i);}); box.appendChild(b);});}
function blur(t, cls){var td=el('td',{class:'bl'}); var sp=el('span',cls?{class:'chip '+cls}:null,t); td.appendChild(sp); return td;}
function render(){
  var root=document.getElementById('app'); root.innerHTML='';
  var db=el('div',{class:'bar'}); pills(db,'日付',D.days.map(function(x){return x.label;}),st.d,function(i){st.d=i;st.v=0;st.r=0;render();}); root.appendChild(db);
  var Y=D.days[st.d];
  var vb=el('div',{class:'bar'}); pills(vb,'会場',Y.venues.map(function(v){return v.venue;}),st.v,function(i){st.v=i;st.r=0;render();}); root.appendChild(vb);
  var V=Y.venues[st.v]; var rb=el('div',{class:'bar'}); pills(rb,'R',V.races.map(function(r){return r.no+'R';}),st.r,function(i){st.r=i;render();}); root.appendChild(rb);
  var sb=el('div',{class:'bar'}); pills(sb,'ペース',D.scen,st.s,function(i){st.s=i;render();});
  sb.appendChild(el('span',{class:'lab',style:'margin-left:10px'},'並び'));
  [['num','馬番順'],['final','LAPS指数順']].forEach(function(o){
    var b=el('button',{type:'button',class:'pill','aria-pressed':st.sort===o[0]?'true':'false'},o[1]);
    b.addEventListener('click',function(){st.sort=o[0];render();}); sb.appendChild(b);}); root.appendChild(sb);
  var R=V.races[st.r]; var card=el('div',{class:'card'}); var h=el('div',{class:'rh'});
  h.appendChild(el('b',null,V.venue+' '+R.no+'R '+R.name)); h.appendChild(el('span',null,R.info));
  h.appendChild(el('span',null,'作成 '+Y.generated+(Y.prov?'（枠順確定前の仮版）':''))); card.appendChild(h);
  if(!R.rows.length){card.appendChild(el('p',{class:'none'},'このレースは指数を出していません（新馬戦など過去の走りが無いレース）。')); root.appendChild(card); return;}
  var t=el('table'), th=el('thead'), r1=el('tr'), r2=el('tr');
  [['枠',''],['馬番',''],['馬名','name'],['AI展開予想','']].forEach(function(x){r1.appendChild(el('th',{class:x[1],rowspan:'2'},x[0]));});
  var lk=el('th',{class:'lockh',colspan:'6'}); var la=el('a',{href:D.url,target:'_blank',rel:'noopener'},'メンバーシップ限定 ›'); lk.appendChild(la); r1.appendChild(lk);
  r1.appendChild(el('th',{class:'fin',rowspan:'2'},'LAPS指数'));
  ['ベース','買いエッジ','消しエッジ','プラス','マイナス','合計'].forEach(function(x){r2.appendChild(el('th',{class:'bl'},x));});
  th.appendChild(r1); th.appendChild(r2); t.appendChild(th);
  var rows=R.rows.slice(), s=st.s;
  // スロー・ハイでは標準と比べた順位の上下を付ける（PDF の LAPS と同じ）
  var rk=function(k){var o={}; R.rows.slice().sort(function(a,b){return b.x[k]-a.x[k]||a.n-b.n;}).forEach(function(x,i){o[x.h]=i+1;}); return o;};
  var rk0=rk(0), rkS=rk(s);
  if(st.sort==='final') rows.sort(function(a,b){return b.x[s]-a.x[s]||a.n-b.n;});
  var tb=el('tbody');
  rows.forEach(function(x){var tr=el('tr');
    var w=el('td'); var wk=el('span',{class:'waku'},x.w==null?'':String(x.w)); var wc=D.waku[String(x.w)];
    if(wc){wk.style.background=wc.bg; wk.style.color=wc.fg;} w.appendChild(wk); tr.appendChild(w);
    tr.appendChild(el('td',null,x.n==null?'':String(x.n))); tr.appendChild(el('td',{class:'name'},x.h));
    var a=el('td',{class:'ais'},x.a||'-'); if(x.a&&D.style[x.a]) a.style.background=D.style[x.a]+'8C'; tr.appendChild(a);
    tr.appendChild(blur('00.0%')); tr.appendChild(blur('＊＊＊＊ +0%','u')); tr.appendChild(blur('＊＊＊＊ −0%','d'));
    tr.appendChild(blur('+00%')); tr.appendChild(blur('−00%')); tr.appendChild(blur('+00%'));
    var fin=el('td',{class:'sc fin'},rate(x.x[s]));
    if(s>0){var dd=rk0[x.h]-rkS[x.h]; if(dd) fin.appendChild(el('span',{class:'mv '+(dd>0?'up':'dn')},'（'+(dd>0?'↑':'↓')+Math.abs(dd)+'）'));}
    tr.appendChild(fin); tb.appendChild(tr);});
  t.appendChild(tb); var tw=el('div',{class:'tw'}); tw.appendChild(t); card.appendChild(tw); root.appendChild(card);
}
render();
